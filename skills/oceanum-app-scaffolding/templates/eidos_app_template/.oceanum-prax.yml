name: {{APP_NAME}}
description: {{APP_DESCRIPTION}}
userRef: {{USER_REF}}
memberRef: {{MEMBER_EMAIL}}
resources:
  sources:
    - name: {{APP_NAME}}-source
      userSecretRef: gitlab-rw-oceanum-dev
      gitlab:
        username: oceanum-dev
        project: oceanum/apps/{{USER_REF}}/{{APP_NAME}}
      defaultBranch: main

  builds:
    - name: {{APP_NAME}}-build
      sourceRef:
        name: {{APP_NAME}}-source
        branch: main
      dockerfile: Dockerfile

  services:
    - name: {{APP_NAME}}-app
      servicePort: 80
      image:
        buildRef: {{APP_NAME}}-build
      command: nginx -g 'daemon off;'
      healthCheck:
        port: 80
        path: /
      route:
        tier: frontend
        publishApp: true
        description: {{APP_DESCRIPTION}}

  stages:
    - name: test
      track:
        branch: main
      resources:
        services:
          - {{APP_NAME}}-app

    - name: prod
      track:
        tag: v\\d+.\\d+.\\d+
      resources:
        services:
          - {{APP_NAME}}-app
