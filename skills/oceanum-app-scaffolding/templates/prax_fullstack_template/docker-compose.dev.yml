version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: {{APP_NAME}}-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - PROJECT_NAME={{APP_NAME}}
      - PROJECT_DESCRIPTION={{APP_DESCRIPTION}}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    container_name: {{APP_NAME}}-frontend-dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
